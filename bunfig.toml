[install]
exact = false

[test]
root = "tests"
preload = ["./tests/setup.ts"]
coverageSkipTestFiles = true
# Build tooling under scripts/ is tested but held to no coverage bar.
coveragePathIgnorePatterns = ["tests/**", "node_modules/**", "scripts/**"]
coverageReporter = ["text", "lcov"]
coverageDir = "coverage"
# Bun reports line and function coverage only. Thresholds start at the Phase 0
# baseline and ratchet towards the targets in docs/testing.md.
coverageThreshold = { lines = 0.8, functions = 0.8 }
