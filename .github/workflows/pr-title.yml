# Squash merges use the PR title as the commit on main, and release-please reads it.
name: PR conventions

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  title:
    name: Title and branch
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check Conventional Commits title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|perf|refactor|test|docs|build|ci|chore|style|revert)(\([a-z0-9,-]+\))?!?: .+'
          [[ "$TITLE" =~ $pattern ]] || {
            echo "::error::PR title must look like 'feat(search): add filters'. Got: $TITLE"
            exit 1
          }
      - name: Check branch name
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          pattern='^((feat|fix|perf|refactor|test|docs|build|ci|chore|style|revert)/[a-z0-9][a-z0-9._-]*|release-please--.+)$'
          [[ "$BRANCH" =~ $pattern ]] || {
            echo "::error::Branch must look like 'feat/search-filters' (type/slug). Got: $BRANCH"
            exit 1
          }
