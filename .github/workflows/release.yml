# Publishes a release when a signed version tag is pushed. It never writes to main or to tags.
#
# `main` and every tag only accept hardware-key signatures, so the version commit and the tag
# are made on a maintainer's machine with `make release` and pushed there. This workflow checks
# that tag, reruns CI on it, and publishes the GitHub release.
#
#   feat -> major, fix -> minor, chore/refactor -> patch,
#   anything else (docs, test, ci, ...) -> no release. The largest bump since the last tag wins.
#
# The rules live in scripts/release-plan.ts (`make release-plan` shows the next release).
name: Release

on:
  push:
    branches: [main]
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+-*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # A push to main only reports what `make release` would publish.
  plan:
    name: Plan release
    if: ${{ github.ref_type == 'branch' && !startsWith(github.event.head_commit.message, 'chore(release):') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - id: plan
        run: bun scripts/release-plan.ts
      - name: Summary
        run: |
          if [ "${{ steps.plan.outputs.release }}" = "true" ]; then
            echo "Next release: ${{ steps.plan.outputs.version }} (${{ steps.plan.outputs.bump }}). Cut it on your machine with \`make release\`." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No release pending: only docs, test or ci changes since the last tag." >> "$GITHUB_STEP_SUMMARY"
          fi

  check:
    name: Check tag
    if: ${{ github.ref_type == 'tag' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Tag is annotated and signed
        run: |
          read -r type sha < <(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq '"\(.object.type) \(.object.sha)"')
          [ "$type" = "tag" ] || { echo "::error::$TAG is not an annotated tag. Create it with git tag -s."; exit 1; }
          [ "$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$sha" --jq .verification.verified)" = "true" ] \
            || { echo "::error::The signature on tag $TAG is not verified."; exit 1; }
      - name: Tagged commit is signed and on main
        run: |
          commit="$(git rev-parse "$TAG^{commit}")"
          [ "$(gh api "repos/$GITHUB_REPOSITORY/commits/$commit" --jq .commit.verification.verified)" = "true" ] \
            || { echo "::error::The signature on commit $commit is not verified."; exit 1; }
          git merge-base --is-ancestor "$commit" origin/main \
            || { echo "::error::$TAG is not on main."; exit 1; }
      - name: Tag matches version files and changelog
        run: bun scripts/release-check.ts "$TAG"

  verify:
    name: Verify
    needs: check
    # A called workflow may not ask for more than this; ci.yml's dependency review job asks for these.
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish
    needs: [check, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: make install
      - name: Release notes
        run: bun scripts/release-check.ts "$VERSION"
      - name: Build
        run: make check-bundle

      - uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            dist/main.js
            dist/styles.css

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=()
          [[ "$VERSION" == *-* ]] && prerelease=(--prerelease)
          gh release create "$VERSION" --verify-tag --title "$VERSION" --notes-file RELEASE_NOTES.md "${prerelease[@]}" \
            dist/main.js dist/manifest.json dist/styles.css
