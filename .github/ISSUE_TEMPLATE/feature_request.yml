name: Feature request
description: Suggest an idea or improvement
labels: [enhancement]
body:
  - type: input
    id: feature-id
    attributes:
      label: Feature ID
      description: The ID from docs/features.md (such as PLN-3), or "new".
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that the plugin does not support today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behaviour or option you would like to see.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Given / When / Then, including at least one edge case. See docs/definition-of-ready-and-done.md.
    validations:
      required: true
  - type: textarea
    id: note-format
    attributes:
      label: Note format
      description: Any Markdown or front matter this reads or writes, as an example.
    validations:
      required: false
